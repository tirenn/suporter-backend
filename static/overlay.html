<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBS Studio Stream Overlay Widget</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/overlay.css">
</head>
<body>
    <div id="overlay-container">
        <!-- Alert Box Widget -->
        <div id="alert-card" class="alert-card hidden">
            <!-- Top Accent Glow Bar -->
            <div class="card-glow-bar"></div>

            <!-- Card Header: Badge & Icon -->
            <div class="card-header">
                <div class="alert-badge" id="alert-badge">
                    <span class="badge-icon" id="badge-icon">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                        </svg>
                    </span>
                    <span id="badge-text">NEW MESSAGE</span>
                </div>
                <div class="sound-indicator" id="sound-indicator">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                    </svg>
                </div>
            </div>

            <!-- Card Content Body -->
            <div class="card-body">
                <div class="sender-name" id="alert-name">Sender Name</div>
                <div class="message-text" id="alert-message">Message content appears here...</div>
            </div>

            <!-- Bottom Progress Timer Bar -->
            <div class="progress-bar-container">
                <div class="progress-bar-fill" id="progress-bar"></div>
            </div>
        </div>
    </div>

    <script src="/overlay.js"></script>
</body>
</html>
