<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suporter Dashboard - Streamer Management & OBS Control</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #090d16;
            --card-bg: #111827;
            --card-border: #1f2937;
            --accent-primary: #6366f1;
            --accent-hover: #4f46e5;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 24px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        .header h1 {
            font-size: 1.6rem;
            font-weight: 800;
            background: linear-gradient(135deg, #6366f1, #a855f7, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .btn-logout {
            background: #ef4444;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 28px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #ffffff;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        @media (max-width: 768px) {
            .grid-2 { grid-template-columns: 1fr; }
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        input[type="text"], input[type="email"], input[type="password"], textarea, select {
            width: 100%;
            background: #0b0f19;
            border: 1px solid #1f2937;
            border-radius: 12px;
            padding: 14px 16px;
            color: #ffffff;
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
        }

        input:focus, textarea:focus, select:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
        }

        .btn {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 14px 20px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn:hover { transform: translateY(-2px); opacity: 0.9; }

        .project-item {
            background: #0b0f19;
            border: 1px solid #1e293b;
            border-radius: 14px;
            padding: 18px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .project-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .project-name { font-size: 1.1rem; font-weight: 700; color: #818cf8; }
        .project-id { font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; color: #94a3b8; }

        .align-picker {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .align-picker select {
            width: auto;
            padding: 6px 12px;
            font-size: 0.85rem;
        }

        .obs-box {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0,0,0,0.4);
            padding: 10px 14px;
            border-radius: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            color: #a7f3d0;
            word-break: break-all;
        }

        .copy-btn {
            background: #334155;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .copy-btn:hover { background: #475569; }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #10b981;
            color: #ffffff;
            padding: 14px 24px;
            border-radius: 12px;
            font-weight: 700;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s ease;
            pointer-events: none;
        }
        .toast.show { opacity: 1; transform: translateY(0); }

        .hidden-section { display: none !important; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div>
                <h1>Suporter Dashboard</h1>
                <p style="color: var(--text-muted); font-size: 0.9rem;">OBS Studio Overlay & Event Stream Management (Golang + Gin + GORM)</p>
            </div>
            <div class="user-info" id="user-info" class="hidden-section">
                <span id="user-name-display" style="font-weight: 700;">User</span>
                <button class="btn-logout" onclick="logout()">Logout</button>
            </div>
        </div>

        <!-- AUTH SECTION -->
        <div id="auth-section" class="grid-2">
            <div class="card">
                <div class="card-title">📝 Register New Account</div>
                <form onsubmit="handleRegister(event)">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="reg-name" required placeholder="e.g. Streamer Pro">
                    </div>
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" id="reg-email" required placeholder="streamer@example.com">
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="reg-password" required placeholder="••••••••">
                    </div>
                    <button type="submit" class="btn" style="margin-top: 10px;">Create Account</button>
                </form>
            </div>

            <div class="card">
                <div class="card-title">🔐 Login with JWT</div>
                <form onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" id="login-email" required placeholder="streamer@example.com">
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="login-password" required placeholder="••••••••">
                    </div>
                    <button type="submit" class="btn" style="margin-top: 10px;">Login to Dashboard</button>
                </form>
            </div>
        </div>

        <!-- APP SECTION -->
        <div id="app-section" class="hidden-section" style="display: flex; flex-direction: column; gap: 28px;">
            <div class="grid-2">
                <div class="card">
                    <div class="card-title">🚀 Create New Project</div>
                    <form onsubmit="handleCreateProject(event)">
                        <div class="form-group">
                            <label>Project Name</label>
                            <input type="text" id="proj-name" required placeholder="e.g. Main Twitch Stream">
                        </div>
                        <div class="form-group">
                            <label>Description</label>
                            <textarea id="proj-desc" placeholder="Project description or notes..."></textarea>
                        </div>
                        <button type="submit" class="btn">Generate Project & OBS Stream URL</button>
                    </form>
                </div>

                <div class="card">
                    <div class="card-title">🧪 Test OBS Stream Alert</div>
                    <form onsubmit="handleTriggerAlert(event)">
                        <div class="form-group">
                            <label>Select Target Project</label>
                            <select id="test-project-select" required></select>
                        </div>
                        <div class="form-group">
                            <label>Sender Name</label>
                            <input type="text" id="alert-name" required value="Alex">
                        </div>
                        <div class="form-group">
                            <label>Alert Message</label>
                            <input type="text" id="alert-msg" required value="Awesome stream! Thanks for playing!">
                        </div>
                        <div class="form-group">
                            <label>Style & Theme</label>
                            <select id="alert-type">
                                <option value="default">Default Message (Indigo)</option>
                                <option value="donation">Donation / Superchat (Gold)</option>
                                <option value="sub">Subscriber (Purple Rose)</option>
                                <option value="follow">Follower (Cyan)</option>
                            </select>
                        </div>
                        <button type="submit" class="btn">Trigger Alert to OBS Now</button>
                    </form>
                </div>
            </div>

            <!-- User Projects List Card -->
            <div class="card">
                <div class="card-title">
                    <span>📡 Your Projects & OBS Overlay URLs</span>
                    <button class="copy-btn" onclick="loadProjects()">Refresh Projects</button>
                </div>
                <div id="projects-list" style="display: flex; flex-direction: column; gap: 14px;">
                    <p style="color: var(--text-muted);">No projects created yet. Create a project above!</p>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">Operation successful!</div>

    <script>
        const API_BASE = window.location.origin + '/api/v1';

        function getToken() { return localStorage.getItem('jwt_token'); }
        function setToken(token) { localStorage.setItem('jwt_token', token); }
        function getUser() { return JSON.parse(localStorage.getItem('user_data') || '{}'); }

        function checkAuthStatus() {
            const token = getToken();
            const user = getUser();

            if (token && user && user.name) {
                document.getElementById('auth-section').classList.add('hidden-section');
                document.getElementById('app-section').classList.remove('hidden-section');
                document.getElementById('user-info').classList.remove('hidden-section');
                document.getElementById('user-name-display').textContent = user.name + ' (' + user.email + ')';
                loadProjects();
            } else {
                document.getElementById('auth-section').classList.remove('hidden-section');
                document.getElementById('app-section').classList.add('hidden-section');
                document.getElementById('user-info').classList.add('hidden-section');
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('reg-name').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;

            try {
                const res = await fetch(`${API_BASE}/auth/register`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ name, email, password })
                });

                const data = await res.json();
                if (res.ok) {
                    setToken(data.access_token);
                    localStorage.setItem('user_data', JSON.stringify(data.user));
                    showToast('🎉 Account registered successfully!');
                    checkAuthStatus();
                } else {
                    showToast('❌ ' + (data.error || 'Registration failed'));
                }
            } catch (err) {
                showToast('❌ Network error during registration');
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            try {
                const res = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();
                if (res.ok) {
                    setToken(data.access_token);
                    localStorage.setItem('user_data', JSON.stringify(data.user));
                    showToast('✅ Logged in successfully!');
                    checkAuthStatus();
                } else {
                    showToast('❌ ' + (data.error || 'Login failed'));
                }
            } catch (err) {
                showToast('❌ Network error during login');
            }
        }

        function logout() {
            localStorage.removeItem('jwt_token');
            localStorage.removeItem('user_data');
            showToast('👋 Logged out');
            checkAuthStatus();
        }

        async function loadProjects() {
            const token = getToken();
            if (!token) return;

            try {
                const res = await fetch(`${API_BASE}/projects`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                const data = await res.json();
                if (res.ok) {
                    renderProjects(data.projects || []);
                }
            } catch (err) {
                console.error('Failed to load projects:', err);
            }
        }

        function renderProjects(projects) {
            const container = document.getElementById('projects-list');
            const select = document.getElementById('test-project-select');

            container.innerHTML = '';
            select.innerHTML = '';

            if (projects.length === 0) {
                container.innerHTML = '<p style="color: var(--text-muted);">No projects created yet. Create a project above!</p>';
                select.innerHTML = '<option value="">No projects available</option>';
                return;
            }

            projects.forEach(p => {
                const projUUID = p.uuid;
                const baseUrl = p.obs_url || `${window.location.origin}/overlay/${projUUID}`;
                
                const item = document.createElement('div');
                item.className = 'project-item';
                item.innerHTML = `
                    <div class="project-header">
                        <span class="project-name">🎥 ${p.name}</span>
                        <span class="project-id">UUID: ${projUUID} | DB ID: ${p.id}</span>
                    </div>
                    <p style="font-size: 0.9rem; color: #cbd5e1;">${p.description || 'No description provided'}</p>
                    
                    <div class="align-picker">
                        <label style="margin: 0;">Positioning Preset:</label>
                        <select id="align-${projUUID}" onchange="updateObsUrl('${projUUID}', '${baseUrl}')">
                            <option value="top-left">Top-Left</option>
                            <option value="top-center">Top-Center</option>
                            <option value="top-right">Top-Right</option>
                            <option value="center">Center Screen</option>
                            <option value="bottom-left">Bottom-Left</option>
                            <option value="bottom-center">Bottom-Center</option>
                            <option value="bottom-right">Bottom-Right</option>
                        </select>
                    </div>

                    <div class="obs-box">
                        <span id="obs-url-display-${projUUID}">${baseUrl}</span>
                        <button class="copy-btn" onclick="copyObsUrl('${projUUID}')">Copy OBS URL</button>
                    </div>
                `;
                container.appendChild(item);

                const opt = document.createElement('option');
                opt.value = projUUID;
                opt.textContent = `${p.name} (${projUUID})`;
                select.appendChild(opt);
            });
        }

        function updateObsUrl(projUUID, baseUrl) {
            const align = document.getElementById(`align-${projUUID}`).value;
            const finalUrl = align === 'top-left' ? baseUrl : `${baseUrl}?align=${align}`;
            document.getElementById(`obs-url-display-${projUUID}`).textContent = finalUrl;
        }

        function copyObsUrl(projUUID) {
            const url = document.getElementById(`obs-url-display-${projUUID}`).textContent;
            navigator.clipboard.writeText(url).then(() => {
                showToast('📋 OBS URL copied to clipboard!');
            });
        }

        async function handleCreateProject(e) {
            e.preventDefault();
            const token = getToken();
            const name = document.getElementById('proj-name').value;
            const description = document.getElementById('proj-desc').value;

            try {
                const res = await fetch(`${API_BASE}/projects`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ name, description })
                });

                const data = await res.json();
                if (res.ok) {
                    showToast('🚀 Project created successfully!');
                    document.getElementById('proj-name').value = '';
                    document.getElementById('proj-desc').value = '';
                    loadProjects();
                } else {
                    showToast('❌ ' + (data.error || 'Failed to create project'));
                }
            } catch (err) {
                showToast('❌ Error creating project');
            }
        }

        async function handleTriggerAlert(e) {
            e.preventDefault();
            const projectUUID = document.getElementById('test-project-select').value;
            const name = document.getElementById('alert-name').value;
            const message = document.getElementById('alert-msg').value;
            const type = document.getElementById('alert-type').value;

            if (!projectUUID) {
                showToast('❌ Please select a project first!');
                return;
            }

            try {
                const res = await fetch(`${API_BASE}/projects/${projectUUID}/alert`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, message, type, duration: 5000 })
                });

                const data = await res.json();
                if (res.ok) {
                    showToast('⚡ Alert triggered to OBS overlay!');
                } else {
                    showToast('❌ ' + (data.error || 'Failed to send alert'));
                }
            } catch (err) {
                showToast('❌ Network error sending alert');
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        checkAuthStatus();
    </script>
</body>
</html>
