basePath: /
definitions:
  domain.AuthResponse:
    properties:
      access_token:
        example: eyJhbGciOiJIUzI1Ni...
        type: string
      user:
        $ref: '#/definitions/domain.User'
    type: object
  domain.CreateProjectRequest:
    properties:
      css_style:
        type: string
      description:
        example: Overlay for my gaming channel
        type: string
      duration:
        example: 7000
        type: integer
      html_template:
        type: string
      name:
        example: My Stream Project
        type: string
    required:
    - name
    type: object
  domain.CreateTemplateRequest:
    properties:
      css_style:
        type: string
      duration:
        example: 5000
        type: integer
      event_type:
        example: donation
        type: string
      fields:
        example:
        - '["name"'
        - '"amount"'
        - '"description"]'
        items:
          type: string
        type: array
      html_template:
        example: <h1>{{name}} donated {{amount}}</h1><p>{{description}}</p>
        type: string
      name:
        example: New Donation Alert
        type: string
    required:
    - event_type
    - html_template
    - name
    type: object
  domain.EventType:
    enum:
    - donation
    - subscriber
    - follower
    - cheer
    - custom
    type: string
    x-enum-varnames:
    - EventTypeDonation
    - EventTypeSubscriber
    - EventTypeFollower
    - EventTypeCheer
    - EventTypeCustom
  domain.LoginRequest:
    properties:
      password:
        example: secret123
        type: string
      username:
        example: johndoe
        type: string
    required:
    - password
    - username
    type: object
  domain.Project:
    properties:
      created_at:
        type: string
      css_style:
        type: string
      description:
        example: Superchat donation alert overlay
        type: string
      duration:
        example: 7000
        type: integer
      event_type:
        example: donation
        type: string
      fields:
        example: '["name","amount","message"]'
        type: string
      html_template:
        type: string
      id:
        example: 1
        type: integer
      name:
        example: Main Stream Overlay
        type: string
      obs_url:
        example: http://localhost:8080/overlay/9b1deb4d-3b7d-4bad-9bdd-2b0d7b3d0001
        type: string
      updated_at:
        type: string
      user_id:
        example: 1
        type: integer
      uuid:
        example: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3d0001
        type: string
    type: object
  domain.RegisterRequest:
    properties:
      name:
        example: John Doe
        type: string
      password:
        example: secret123
        minLength: 6
        type: string
      username:
        example: johndoe
        maxLength: 50
        minLength: 3
        type: string
    required:
    - name
    - password
    - username
    type: object
  domain.Template:
    properties:
      created_at:
        type: string
      css_style:
        example: '.alert { background: gold; color: black; }'
        type: string
      duration:
        example: 5000
        type: integer
      event_type:
        allOf:
        - $ref: '#/definitions/domain.EventType'
        example: donation
      fields:
        example: '["name","amount","description"]'
        type: string
      html_template:
        example: <div class='alert'><h1>{{name}} donated {{amount}}</h1><p>{{description}}</p></div>
        type: string
      id:
        example: 1
        type: integer
      name:
        example: New Donation Alert
        type: string
      project_id:
        example: 1
        type: integer
      updated_at:
        type: string
    type: object
  domain.TriggerAlertRequest:
    properties:
      amount:
        example: $50.00
        type: string
      duration:
        example: 7000
        type: integer
      message:
        example: Keep up the awesome stream!
        type: string
      name:
        example: Alex
        type: string
    required:
    - amount
    - message
    - name
    type: object
  domain.TriggerCustomAlertRequest:
    properties:
      duration:
        example: 5000
        type: integer
      payload:
        additionalProperties:
          type: string
        type: object
    required:
    - payload
    type: object
  domain.UpdateProjectRequest:
    properties:
      css_style:
        type: string
      description:
        type: string
      duration:
        type: integer
      html_template:
        type: string
      name:
        type: string
    type: object
  domain.User:
    properties:
      created_at:
        type: string
      id:
        example: 1
        type: integer
      name:
        example: John Doe
        type: string
      updated_at:
        type: string
      username:
        example: johndoe
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: support@suporter.local
    name: Suporter Support
  description: High-performance REST API & real-time OBS Studio Browser Source Overlay
    Backend built with Golang, Gin, GORM, PostgreSQL, and Goose.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Suporter API - OBS Studio Overlay Backend
  version: "1.0"
paths:
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate username & password, returns JWT token.
      parameters:
      - description: User Credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.AuthResponse'
        "401":
          description: Invalid username or password
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login user account (Requires Username)
      tags:
      - Authentication
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: Register user with name, username, and password. Returns JWT token.
      parameters:
      - description: User Registration Details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.AuthResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Username already exists
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register a new user account (Requires Username)
      tags:
      - Authentication
  /api/v1/projects:
    get:
      description: Get user projects with generated OBS Stream URLs and template details.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List all projects for authenticated user
      tags:
      - Projects
    post:
      consumes:
      - application/json
      description: Create project with name, description, and overlay template HTML/CSS.
        Generates unique Project UUID v4 & OBS Stream URL.
      parameters:
      - description: Project Info & Template
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.CreateProjectRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.Project'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create a new project with donation overlay template
      tags:
      - Projects
  /api/v1/projects/{uuid}:
    delete:
      description: Delete project by UUID.
      parameters:
      - description: Project UUID
        in: path
        name: uuid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete project
      tags:
      - Projects
    get:
      description: Retrieve single project details with OBS Stream URL & template
        HTML/CSS.
      parameters:
      - description: Project UUID
        in: path
        name: uuid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Project'
        "404":
          description: Project Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get project details by UUID
      tags:
      - Projects
    put:
      consumes:
      - application/json
      description: Update project name, description, html_template, css_style, or
        duration.
      parameters:
      - description: Project UUID
        in: path
        name: uuid
        required: true
        type: string
      - description: Updated Project Template Info
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.UpdateProjectRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Project'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update project overlay template
      tags:
      - Projects
  /api/v1/projects/{uuid}/alert:
    post:
      consumes:
      - application/json
      description: Send required donation variables (name, amount, message) to pop
        up on OBS Studio overlay. Requires JWT authentication via Authorization Bearer
        header.
      parameters:
      - description: Project UUID
        in: path
        name: uuid
        required: true
        type: string
      - description: Donation Alert Payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.TriggerAlertRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized - Missing or Invalid JWT Token
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Project Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Trigger donation alert to project OBS overlay (Requires JWT Bearer
        Token)
      tags:
      - Projects
  /api/v1/projects/{uuid}/templates:
    get:
      description: Retrieve custom alert templates configured for a project.
      parameters:
      - description: Project UUID
        in: path
        name: uuid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List custom overlay templates for a project
      tags:
      - Templates
    post:
      consumes:
      - application/json
      description: Add a custom alert template with HTML, CSS, and dynamic variables
        (e.g. {{name}}, {{amount}}, {{description}}).
      parameters:
      - description: Project UUID
        in: path
        name: uuid
        required: true
        type: string
      - description: Template Definition
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.CreateTemplateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.Template'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create custom overlay template
      tags:
      - Templates
  /api/v1/projects/{uuid}/templates/{id}:
    delete:
      parameters:
      - description: Project UUID
        in: path
        name: uuid
        required: true
        type: string
      - description: Template ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete custom overlay template
      tags:
      - Templates
    get:
      parameters:
      - description: Project UUID
        in: path
        name: uuid
        required: true
        type: string
      - description: Template ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Template'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get custom template details
      tags:
      - Templates
    put:
      consumes:
      - application/json
      parameters:
      - description: Project UUID
        in: path
        name: uuid
        required: true
        type: string
      - description: Template ID
        in: path
        name: id
        required: true
        type: integer
      - description: Updated Template
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.CreateTemplateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Template'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update custom overlay template
      tags:
      - Templates
  /api/v1/projects/{uuid}/templates/{id}/trigger:
    post:
      consumes:
      - application/json
      description: Send dynamic key-value payload (e.g. name, amount, description)
        to pop up on OBS Studio overlay using custom template HTML/CSS.
      parameters:
      - description: Project UUID
        in: path
        name: uuid
        required: true
        type: string
      - description: Template ID
        in: path
        name: id
        required: true
        type: integer
      - description: Dynamic Key-Value Payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.TriggerCustomAlertRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Trigger live alert using custom overlay template
      tags:
      - Templates
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and your JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
