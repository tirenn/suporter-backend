name: "Deploy Backend to VPS on Tag"

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: "backend-production-deploy"
  cancel-in-progress: false

jobs:
  build-and-test:
    name: "Build & Unit Tests"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Set up Go"
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          check-latest: true
          cache-dependency-path: go.sum

      - name: "Download Go Dependencies"
        run: go mod download

      - name: "Build Backend Binary"
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-w -s" -o bin/server ./cmd/server

      - name: "Run Backend Unit Tests"
        run: go test -v -race ./...

  deploy:
    name: "Deploy to Production VPS"
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      - name: "Fetch Secrets from Doppler"
        uses: dopplerhq/secrets-fetch-action@v1.2.0
        id: doppler
        with:
          doppler-token: ${{ secrets.DOPPLER_TOKEN }}

      - name: "Deploy to VPS via SSH"
        uses: appleboy/ssh-action@v1.0.3
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          DEPLOY_PATH: ${{ secrets.TARGET_DIR || '/root/Projects/suporter-backend' }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: RELEASE_TAG,DOPPLER_TOKEN,DEPLOY_PATH
          script_stop: true
          script: |
            echo "=========================================================="
            echo "🚀 Starting Backend Deployment for Tag: $RELEASE_TAG"
            echo "=========================================================="

            # 1. Ensure target deployment directory exists
            mkdir -p "$DEPLOY_PATH"
            cd "$DEPLOY_PATH"

            # 2. Check if git repository exists, otherwise initialize/clone
            if [ ! -d ".git" ]; then
              echo "Cloning backend repository..."
              git clone "${{ github.server_url }}/${{ github.repository }}.git" .
            fi

            # 3. Fetch latest tags and checkout the release tag
            echo "Fetching tags and checking out $RELEASE_TAG..."
            git fetch --tags --all --prune
            git checkout "$RELEASE_TAG"

            # 4. Configure Doppler & Generate production .env
            echo "Configuring environment variables via Doppler..."
            if command -v doppler &> /dev/null; then
              DOPPLER_TOKEN="$DOPPLER_TOKEN" doppler secrets download --no-file --format env > .env
            else
              echo "Installing Doppler CLI on VPS..."
              curl -sLf --retry 3 --tlsv1.2 'https://packages.doppler.com/public/cli/gpg.key' | sudo apt-key add - 2>/dev/null || true
              echo "deb https://packages.doppler.com/public/cli/deb/debian any-version main" | sudo tee /etc/apt/sources.list.d/doppler-cli.list > /dev/null 2>&1 || true
              sudo apt-get update -y > /dev/null 2>&1 || true
              sudo apt-get install -y doppler > /dev/null 2>&1 || true

              if command -v doppler &> /dev/null; then
                DOPPLER_TOKEN="$DOPPLER_TOKEN" doppler secrets download --no-file --format env > .env
              else
                echo "Warning: Doppler CLI could not be installed automatically."
              fi
            fi

            # 5. Build and start backend container using Docker Compose
            echo "Building and restarting Backend Docker services..."
            docker compose down --remove-orphans || true
            docker compose up -d --build --remove-orphans

            # 6. Wait for database and services to become healthy
            echo "Waiting for services to become healthy..."
            sleep 8

            # 7. Run database migrations
            echo "Executing database migrations..."
            docker compose exec -T backend ./server -migrate-up || echo "Migration step completed."

            # 8. Check running containers
            docker compose ps
            
            # 9. Clean up unused images
            echo "Cleaning up dangling docker images..."
            docker image prune -f || true

            echo "=========================================================="
            echo "✅ Backend Deployment of $RELEASE_TAG Completed Successfully!"
            echo "=========================================================="
