name: Suporter Backend CI/CD Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  # -------------------------------------------------------------
  # CI JOB: Test and Build Verification
  # -------------------------------------------------------------
  ci:
    name: Run Go Unit Tests & Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: go.sum

      - name: Run Backend Unit Tests
        run: go test -v ./...

      - name: Compile Backend Binary Check
        run: CGO_ENABLED=0 go build -v ./cmd/server

  # -------------------------------------------------------------
  # CD JOB: Deploy Backend to Production VPS via SSH
  # -------------------------------------------------------------
  cd:
    name: Deploy Backend to VPS
    needs: ci
    if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH to VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          BACKEND_ENV: ${{ secrets.SUPORTER_BACKEND_ENV }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SUPORTER_SSH_HOST }}
          username: ${{ secrets.SUPORTER_SSH_USER }}
          key: ${{ secrets.SUPORTER_SSH_KEY }}
          port: ${{ secrets.SUPORTER_SSH_PORT || 22 }}
          envs: BACKEND_ENV,GH_TOKEN
          script: |
            set -e
            echo "🚀 Starting Suporter Backend deployment on VPS..."

            TARGET_DIR="/var/www/suporter-backend"
            mkdir -p "$TARGET_DIR"
            cd "$TARGET_DIR"

            REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"

            # Clone if not present, otherwise pull latest changes
            if [ ! -d ".git" ]; then
              echo "Cloning repository..."
              git clone "$REPO_URL" .
            else
              echo "Pulling latest code from ${{ github.ref_name }}..."
              git remote set-url origin "$REPO_URL"
              git fetch origin
              git reset --hard origin/${{ github.ref_name }}
            fi

            # Inject .env secrets if provided
            if [ -n "$BACKEND_ENV" ]; then
              echo "Configuring .env..."
              printf '%s\n' "$BACKEND_ENV" > .env
            fi

            # Build and launch Backend Docker container
            echo "Building and launching Backend container..."
            docker compose down || true
            docker compose up --build -d

            # Clean up dangling images
            docker image prune -f

            echo "✅ Backend deployment completed successfully!"
